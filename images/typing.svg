<svg xmlns="http://w3.org" viewBox="0 0 450 50" width="450" height="50">
  <style>
    .typing-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 18px;
      fill: #715A5A;
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid #D3DAD9;
      display: inline-block;
      animation: 
        typing 3.5s steps(30, end) infinite alternate,
        blink-cursor 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink-cursor {
      from, to { border-color: transparent }
      50% { border-color: #D3DAD9 }
    }
  </style>

  <g transform="translate(10, 30)">
    <text class="typing-text">Coding Computer Vision &amp; Designing Games...</text>
  </g>
</svg>
